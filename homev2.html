<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Is It Done Yet</title>
    <meta
      name="description"
      content="Count what is on your counter with a camera, then pick a dish you can actually finish with it."
    />

    <!--
      The cook flow, rebuilt in the front-of-house design language.

      This page reproduces the flow, structure and copy of the version deployed at
      https://is-it-done-yet.vercel.app/ -- title, counter, library, dish card -- and restyles
      it against the menu design document. The deployed page's source is not in this
      repository and never was: DECISIONS.md #24 records how that was established and what was
      done about it. Its own HTML comment points at a `src/ui/scan.ts` and an `api/vision`
      route that exist on no branch here.

      TWO DETECTORS, ON PURPOSE, and the deployed page said so too. The live count is the local
      classifier: instant, offline, and it follows an ingredient as you move it, but it knows
      six things. "Identify everything" is one call to a vision model behind `api/vision`,
      which can name anything and takes a couple of seconds. Neither replaces the other. That
      relay is not in this repository either, so the button probes for it at startup and
      disables itself honestly when it is absent -- see `src/home/scan.ts`.

      NOT index.html, NOT app.html. `index.html` is the laptop debug app. `app.html` is the
      artboard build -- seven fixed screens at their true size, scaled by one transform, for
      reading through a lens. This is the same flow as a resizable browser page.
    -->

    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#e7d4c0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <!-- Self-hosted and preloaded. The deployed page fetches both from Google Fonts, which
         costs a connection and a round trip before anything is readable and then reflows every
         screen at once when they land. The whole design is set in these two faces, so that
         reflow is the entire page moving. Preload rather than merely `@font-face`, because the
         declaration lives in a CSS file the bundler has not parsed yet at this point. -->
    <link rel="preload" href="./menu/fonts/ranchers-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./menu/fonts/hanken-grotesk.woff2" as="font" type="font/woff2" crossorigin />

    <style>
      /* Only the pre-boot ground, so a slow module load shows the counter colour rather than a
         white flash. Everything else is in src/home/theme.css. */
      html, body { margin: 0; background: #e7d4c0; }

      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 10px;
        padding: 24px;
        text-align: center;
        color: #46101a;
        font: 800 16px/1.4 system-ui, sans-serif;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      #boot.gone { display: none; }

      /* The uncaught-error banner `src/home/main.ts` writes into. Fixed to the bottom so it
         cannot be scrolled past, and loud, because the only thing worse than an error is one
         nobody notices. */
      #fatal {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 99;
        padding: 12px 18px;
        background: #f5230e;
        color: #fff3e4;
        font: 700 13px/1.45 ui-monospace, Menlo, Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <!-- Removed by the module once it has mounted. If this is still on screen, the bundle did
         not load, and saying so beats an empty page. -->
    <div id="boot">
      <div>Is It Done Yet</div>
      <div style="opacity: 0.6; font-weight: 500; letter-spacing: 0.04em; text-transform: none">
        starting…
      </div>
    </div>

    <script type="module">
      import '/src/home/main.ts';
      document.getElementById('boot')?.classList.add('gone');

      // Production only, and the guard is load-bearing rather than tidy. `public/sw.js` caches
      // everything but navigations cache-first, which is right for a built bundle because Vite
      // fingerprints asset filenames -- and completely wrong in dev, where module URLs are
      // stable, so every edit is served from the cache and the app silently stops updating.
      // (DECISIONS.md #22 records the session this cost.)
      if (import.meta.env.PROD && 'serviceWorker' in navigator) {
        navigator.serviceWorker
          .register(`${import.meta.env.BASE_URL}sw.js`, { scope: import.meta.env.BASE_URL })
          .catch((err) => console.info('[home] service worker not registered (needs https or localhost)', err));
      }

      // A worker registered by an earlier dev session outlives the guard above and goes on
      // serving stale modules until something removes it. This is that something.
      if (import.meta.env.DEV && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations?.().then((regs) => {
          for (const reg of regs) void reg.unregister();
        }).catch(() => {});
      }
    </script>
  </body>
</html>
