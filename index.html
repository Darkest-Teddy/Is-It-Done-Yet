<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0b0d11" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Is It Done Yet</title>
    <style>
      :root {
        --bg: #0d0f12; --panel: #161a20; --line: #262c35;
        --ink: #e8ecf1; --dim: #8b95a1; --accent: #8ee06a;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--ink);
        font: 400 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      #app {
        display: grid; grid-template-columns: 1fr 260px;
        grid-template-rows: auto 1fr; min-height: 100vh; gap: 0;
      }
      header {
        grid-column: 1 / -1; display: flex; align-items: baseline; gap: 16px;
        padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
      }
      h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
      #status {
        font: 400 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--dim); font-variant-numeric: tabular-nums;
      }
      #stage {
        display: grid; grid-template-rows: 1fr auto; gap: 12px;
        place-items: center; padding: 16px; min-width: 0; min-height: 0;
      }
      canvas { max-width: 100%; max-height: calc(100vh - 230px); border-radius: 6px; }
      /* Master spec 7.4: "Display plain numbers. A judge parses that in one second." So the
         sentence is the interface, at a size somebody reads from behind your shoulder. */
      #readout { width: 100%; display: grid; gap: 8px; }
      #score {
        font: 600 28px/1.25 ui-sans-serif, system-ui, sans-serif;
        font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
      }
      #detail {
        font: 400 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--dim); font-variant-numeric: tabular-nums;
      }
      #ticket {
        font: 500 13px/1.4 ui-sans-serif, system-ui, sans-serif; color: var(--accent);
      }
      #cuts {
        list-style: none; display: flex; flex-wrap: wrap; gap: 6px;
        margin: 0; padding: 0; max-height: 64px; overflow-y: auto;
      }
      /* The booth board. People come back to beat their number, and a crowd is the point. */
      #board {
        list-style: none; margin: 0; padding: 0; display: grid; gap: 2px;
        font: 400 11px/1.5 ui-monospace, monospace; color: var(--dim);
        font-variant-numeric: tabular-nums;
      }
      #board:not(:empty) { border-top: 1px solid var(--line); padding-top: 8px; }
      #board li:first-child { color: var(--accent); }
      #cuts li {
        font: 400 12px ui-monospace, monospace; font-variant-numeric: tabular-nums;
        padding: 3px 8px; border-radius: 4px;
        background: var(--panel); border: 1px solid var(--line); color: var(--ink);
      }
      /* A low-confidence slice is still recorded, and still says so. */
      #cuts li.uncertain { color: var(--dim); border-style: dashed; }
      #controls {
        display: flex; flex-direction: column; gap: 14px;
        padding: 18px 16px; border-left: 1px solid var(--line); background: var(--panel);
      }
      #controls { overflow-y: auto; max-height: 100vh; }
      #controls h2 {
        margin: 10px 0 0; font: 600 11px/1 ui-sans-serif, system-ui, sans-serif;
        text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim);
        border-bottom: 1px solid var(--line); padding-bottom: 6px;
      }
      #controls label { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; }
      #reset {
        padding: 7px 10px; border-radius: 5px; cursor: pointer;
        background: var(--bg); color: var(--ink); border: 1px solid var(--line);
        font: 500 13px ui-sans-serif, system-ui, sans-serif;
      }
      #reset:hover, #save:hover { border-color: var(--accent); color: var(--accent); }
      #save {
        padding: 7px 10px; border-radius: 5px; cursor: pointer;
        background: var(--bg); color: var(--ink); border: 1px solid var(--line);
        font: 500 13px ui-sans-serif, system-ui, sans-serif;
      }
      /* The clip stays in the sidebar so its scrub bar is reachable; the canvas shows the
         analysed frame, which is the thing actually worth looking at. */
      video.clip { display: none; width: 100%; border-radius: 5px; }
      video.clip.shown { display: block; }
      #controls span { font-size: 12px; color: var(--dim); }
      #controls output {
        font: 400 12px ui-monospace, monospace; color: var(--accent);
        font-variant-numeric: tabular-nums;
      }
      #controls input, #controls select { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
      #controls select {
        background: var(--bg); color: var(--ink);
        border: 1px solid var(--line); border-radius: 4px; padding: 5px 6px;
      }
      #drop {
        display: grid; gap: 2px; margin-top: 4px; padding: 16px 12px;
        border: 1px dashed var(--line); border-radius: 6px; text-align: center;
        cursor: pointer; transition: border-color 120ms, background 120ms;
      }
      #drop:hover, #drop.over { border-color: var(--accent); background: #12170f; }
      #drop strong { font-size: 13px; font-weight: 600; }
      #drop span { font-size: 11px; color: var(--dim); }
      #drop em {
        font: 400 11px ui-monospace, monospace; font-style: normal;
        color: var(--accent); word-break: break-all; margin-top: 4px;
      }
      /* ---- Recipe book and global board ------------------------------------------------
         Both are overlays rather than another column: this page already runs in Quest
         Browser as a flat 2D page, and a third column at that width leaves nothing for the
         canvas. An overlay is the same code in both places. */
      #nav { margin-left: auto; display: flex; gap: 8px; }
      #nav button, .panel button, #run-submit button {
        font: 500 12px/1 ui-sans-serif, system-ui, sans-serif;
        background: var(--bg); color: var(--ink);
        border: 1px solid var(--line); border-radius: 5px; padding: 7px 10px; cursor: pointer;
      }
      #nav button:hover, .panel button:hover, #run-submit button:hover { border-color: var(--accent); }
      #run-submit button:disabled { opacity: 0.5; cursor: default; }
      .panel[hidden], #run-submit[hidden], #recipe-form[hidden] { display: none; }
      .panel {
        position: fixed; inset: 0; z-index: 10;
        display: grid; grid-template-rows: auto auto 1fr auto;
        gap: 10px; padding: 16px;
        background: rgba(8, 10, 13, 0.94); backdrop-filter: blur(3px);
      }
      @media (min-width: 720px) {
        .panel {
          inset: 6vh 50%; width: min(560px, 92vw); transform: translateX(-50%);
          border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
        }
      }
      .panel > header {
        grid-column: auto; display: flex; align-items: center; gap: 12px;
        padding: 0 0 10px; background: none; border-bottom: 1px solid var(--line);
      }
      .panel h2 { margin: 0; font-size: 14px; font-weight: 600; }
      .panel .note { font: 400 11px/1.4 ui-monospace, monospace; color: var(--dim); }
      .panel input[type="text"], .panel input[type="number"], .panel textarea, .panel select {
        background: var(--bg); color: var(--ink); border: 1px solid var(--line);
        border-radius: 5px; padding: 8px 9px; font: 400 13px ui-sans-serif, system-ui, sans-serif;
        width: 100%;
      }
      .panel .scroll { overflow-y: auto; min-height: 0; }
      #recipe-list, #board-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
      #recipe-list button {
        width: 100%; display: grid; grid-template-columns: 24px 1fr; gap: 2px 10px;
        text-align: left; padding: 9px 10px;
      }
      #recipe-list .icon { grid-row: 1 / 3; font-size: 18px; }
      #recipe-list .name { font-size: 13px; font-weight: 600; }
      #recipe-list .meta, #recipe-list .empty, #board-list .empty {
        font: 400 11px ui-monospace, monospace; color: var(--dim);
      }
      #board-list li {
        display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: baseline;
        padding: 7px 10px; border: 1px solid var(--line); border-radius: 5px;
        font-variant-numeric: tabular-nums;
      }
      /* The row the player just earned. A board you cannot find yourself on is a list. */
      #board-list li.mine { border-color: var(--accent); background: #101508; }
      #board-list .rank { font: 500 12px ui-monospace, monospace; color: var(--dim); }
      #board-list .who { font-size: 13px; overflow-wrap: anywhere; }
      #board-list .pts { font: 600 14px ui-monospace, monospace; color: var(--accent); }
      #recipe-form { display: grid; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
      #recipe-form label { font: 400 11px ui-monospace, monospace; color: var(--dim); display: grid; gap: 4px; }
      #recipe-ingredients { display: grid; gap: 6px; }
      .ing-row { display: grid; grid-template-columns: 1fr 72px 84px 32px; gap: 6px; }
      .ing-remove { padding: 0 !important; }
      #run-submit {
        display: grid; gap: 8px; padding: 10px; margin-top: 4px;
        border: 1px solid var(--line); border-radius: 6px;
      }
      #run-submit .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
      #run-submit input {
        background: var(--bg); color: var(--ink); border: 1px solid var(--line);
        border-radius: 5px; padding: 7px 9px; font: 400 13px ui-sans-serif, system-ui, sans-serif;
      }
      #run-summary { font: 600 13px ui-sans-serif, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
      #run-note, #recipe-form-note {
        font: 400 11px ui-monospace, monospace; color: var(--dim);
      }
      @media (max-width: 720px) {
        #app { grid-template-columns: 1fr; }
        #controls { border-left: 0; border-top: 1px solid var(--line); }
      }
    </style>
  </head>
  <body>
    <main id="app">
      <header>
        <h1>ingredient detection</h1>
        <div id="status" role="status">loading OpenCV…</div>
        <nav id="nav">
          <button id="open-recipes" type="button">Recipe book</button>
          <button id="open-board" type="button">Leaderboard</button>
        </nav>
      </header>
      <div id="stage">
        <canvas id="view"></canvas>
        <section id="readout">
          <div id="ticket">Free practice</div>
          <div id="score">No cuts yet.</div>
          <div id="detail">waiting for a cucumber</div>
          <ol id="cuts"></ol>
          <ol id="board"></ol>
          <!-- Appears once there is a cut to submit. Prefilled from localStorage, because
               typing a name on a headset keyboard twice is once too many. -->
          <div id="run-submit" hidden>
            <div id="run-summary"></div>
            <div class="row">
              <input id="run-name" type="text" placeholder="name for the board" autocomplete="off" />
              <button id="run-send" type="button">Submit score</button>
            </div>
            <div id="run-note"></div>
          </div>
        </section>
      </div>
      <aside id="controls"></aside>
    </main>

    <!-- Overlays. Declared here rather than built in TypeScript so the layout stays editable
         without touching code, matching how #readout and #controls already work. -->
    <section id="recipe-panel" class="panel" hidden aria-label="Recipe book">
      <header>
        <h2>Recipe book</h2>
        <button id="recipe-form-toggle" type="button" style="margin-left:auto">New recipe</button>
        <button id="recipe-close" type="button">Close</button>
      </header>
      <input id="recipe-search" type="text" placeholder="search by name, tag or ingredient" autocomplete="off" />
      <div class="scroll">
        <ul id="recipe-list"></ul>
      </div>
      <div>
        <div id="recipe-note" class="note"></div>
        <form id="recipe-form" hidden>
          <label>title
            <input id="recipe-title" type="text" placeholder="Cucumber salad" autocomplete="off" />
          </label>
          <label>servings
            <input id="recipe-servings" type="number" min="1" max="64" value="2" />
          </label>
          <label>ingredients
            <div id="recipe-ingredients"></div>
          </label>
          <button id="recipe-add-ingredient" type="button">Add ingredient</button>
          <label>steps, one per line
            <textarea id="recipe-steps" rows="4" placeholder="Rinse the cucumber&#10;Slice it 4mm thick"></textarea>
          </label>
          <button type="submit">Save recipe</button>
          <div id="recipe-form-note"></div>
        </form>
      </div>
    </section>

    <section id="board-panel" class="panel" hidden aria-label="Global leaderboard">
      <header>
        <h2>Global leaderboard</h2>
        <button id="board-refresh" type="button" style="margin-left:auto">Refresh</button>
        <button id="board-close" type="button">Close</button>
      </header>
      <div id="board-note" class="note"></div>
      <div class="scroll">
        <ol id="board-list"></ol>
      </div>
      <div class="note">Top 20 by score. A tie goes to whoever got there first.</div>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
